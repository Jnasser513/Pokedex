[versions]
agp = "9.2.1"
kotlin = "2.2.10"
ksp = "2.3.4"

compileSdk = "36"
compileSdkMinor = "1"
minSdk = "24"
targetSdk = "36"
jvm = "17"

activity = "1.13.0"
